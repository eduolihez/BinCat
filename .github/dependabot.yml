# ===========================================================================
#  Dependabot — BinCat
#
#  Sustituye a la version anterior, que tenia tres problemas:
#    - interval "daily" en un proyecto que cambia poco: mucho ruido a cambio
#      de nada. Pasa a semanal, como el resto de repositorios.
#    - prefix "fix" en los commits: estas actualizaciones no arreglan nada,
#      son mantenimiento de dependencias. Pasa a "deps" / "ci".
#    - no vigilaba las GitHub Actions, asi que dependabot-auto-merge.yml se
#      quedaba con versiones viejas sin avisar.
# ===========================================================================
version: 2

updates:
  # --- GitHub Actions (.github/workflows/) --------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # --- pip (requirements.txt) ---------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    # Menor y parche agrupados en un solo pull request; las versiones mayores
    # llegan por separado para poder revisarlas con calma.
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"
